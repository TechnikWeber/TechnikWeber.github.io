title: Philipps Blog
description: Elektronik, Software, Amateurfunk · @TechnikWeber · DL4PW
author: Philipp Weber
url: https://TechnikWeber.github.io
lang: de
timezone: Europe/Berlin
permalink: /:year/:title/
show_excerpts: true
theme: minima

# Datumsformat deutsch statt "Aug 25, 2026"
minima:
  date_format: "%d.%m.%Y"

header_pages:
  - index.md
  - themen.md
  - ueber-mich.md
  - impressum.md
  - datenschutz.md

# Dateien, die nur fürs Repo gedacht sind und nicht auf die Seite gehören
exclude:
  - CLAUDE.md
  - README.md
  - _eingang/

# Beiträge nutzen automatisch das Layout "beitrag" – das ist minimas
# Beitragslayout plus der Tag-Zeile am Ende
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: beitrag

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
