---
layout: post
---
{{ content }}

{%- if page.tags.size > 0 %}
<p class="post-tags">
  Themen:
  {%- for tag in page.tags %}
  <a href="{{ '/themen/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
  {%- unless forloop.last %} · {% endunless -%}
  {%- endfor %}
</p>

<style>
  .post-tags {
    margin-top: 2em;
    padding-top: 1em;
    border-top: 1px solid #e8e8e8;
    font-size: 0.9em;
    color: #828282;
  }
</style>
{%- endif %}
